<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; require-trusted-types-for 'script'; trusted-types 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="text-scale" content="scale">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101319" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Vos actualités tech et sport sur 48 heures, les dernières publications BD et les derniers chapitres de vos mangas.">
  <meta name="apple-mobile-web-app-title" content="Actualités">
  <link rel="icon" href="icon.svg?v=2" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>Actualités</title>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#feed">Aller aux actualités</a>
  <div class="shell">
    <main>
      <div class="toolbar"><nav class="tabs" aria-label="Filtrer les actualités"><button class="tab" data-group="BD" aria-pressed="false">BD <span class="tab-count" aria-hidden="true">—</span></button><button class="tab" data-group="Sport" aria-pressed="false">Sport <span class="tab-count" aria-hidden="true">—</span></button><button class="tab active" data-group="Tech" aria-pressed="true">Tech <span class="tab-count" aria-hidden="true">—</span></button></nav><div class="toolbar-status"><span id="updated" role="status" aria-label="Dernière collecte"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.1 7a7 7 0 0 1 11.5-2L20 8M4 16l2.4 3A7 7 0 0 0 17.9 17"/></svg><span id="updated-time">…</span></span><button class="sources-button" id="show-sources" aria-haspopup="dialog" aria-controls="sources-dialog">Sources <span id="source-count">—</span></button></div></div>
      <p id="notice" class="notice" role="status" hidden></p>
      <section id="manga-feed" class="day-section" aria-label="Derniers chapitres des mangas suivis" hidden></section>
      <div id="feed" tabindex="-1" aria-label="Articles et dernières publications BD" aria-busy="true"><div class="empty">Récupération de vos actualités…</div></div>
    </main>
  </div>
  <dialog id="sources-dialog" aria-labelledby="sources-title"><div class="dialog-heading"><div><p class="eyebrow">VOTRE SÉLECTION</p><h2 id="sources-title">Toutes vos sources</h2></div><button class="icon-button" id="close-sources" autofocus aria-label="Fermer">✕</button></div><div id="sources-list"></div></dialog>
</body>
</html>
