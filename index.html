<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; require-trusted-types-for 'script'; trusted-types 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="text-scale" content="scale">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101319" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Vos actualités tech et sport sur 48 heures, les dernières publications BD et les derniers chapitres de vos mangas.">
  <meta name="apple-mobile-web-app-title" content="Actualités">
  <link rel="icon" href="icon.svg?v=2" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>Actualités</title>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#feed">Aller aux actualités</a>
  <div class="shell">
    <main>
      <div class="toolbar">
        <nav class="tabs" aria-label="Filtrer les actualités">
          <button type="button" class="tab" data-group="BD" aria-pressed="false" aria-label="BD" title="BD">
            <svg class="toolbar-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 6a6 6 0 0 0-4-2H3v14h5a6 6 0 0 1 4 2 6 6 0 0 1 4-2h5V4h-5a6 6 0 0 0-4 2v14"/>
            </svg>
            <span class="tab-count" aria-hidden="true">—</span>
          </button>
          <button type="button" class="tab" data-group="Sport" aria-pressed="false" aria-label="Sport" title="Sport">
            <svg class="toolbar-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 4h8v6a4 4 0 0 1-8 0V4ZM8 6H4v2a4 4 0 0 0 4 4m8-6h4v2a4 4 0 0 1-4 4m-4 2v6m-4 0h8"/>
            </svg>
            <span class="tab-count" aria-hidden="true">—</span>
          </button>
          <button type="button" class="tab active" data-group="Tech" aria-pressed="true" aria-label="Tech" title="Tech">
            <svg class="toolbar-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="6" y="6" width="12" height="12" rx="2"/>
              <path d="M10 3v3m4-3v3m-4 12v3m4-3v3M3 10h3m-3 4h3m12-4h3m-3 4h3"/>
              <rect x="10" y="10" width="4" height="4" rx=".5"/>
            </svg>
            <span class="tab-count" aria-hidden="true">—</span>
          </button>
        </nav>
        <div class="toolbar-status">
          <span id="updated" role="status" aria-label="Dernière collecte"><span id="updated-time">…</span></span>
          <button type="button" class="sources-button" id="show-sources" aria-label="Sources" title="Sources" aria-haspopup="dialog" aria-controls="sources-dialog">
            <svg class="toolbar-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 6h12M9 12h12M9 18h12M3 6h1m-1 6h1m-1 6h1"/>
            </svg>
            <span id="source-count">—</span>
          </button>
        </div>
      </div>
      <p id="notice" class="notice" role="status" hidden></p>
      <section id="manga-feed" class="day-section" aria-label="Derniers chapitres des mangas suivis" hidden></section>
      <div id="feed" tabindex="-1" aria-label="Articles et dernières publications BD" aria-busy="true"><div class="empty">Récupération de vos actualités…</div></div>
    </main>
  </div>
  <dialog closedby="any" id="sources-dialog" aria-labelledby="sources-title"><div class="dialog-heading"><div><p class="eyebrow">VOTRE SÉLECTION</p><h2 id="sources-title">Toutes vos sources</h2></div><button class="icon-button" id="close-sources" autofocus aria-label="Fermer">✕</button></div><div id="sources-list"></div></dialog>
</body>
</html>
