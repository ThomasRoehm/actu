name: Collecter et publier Actu
on:
  push:
    branches: [main]
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actu-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier les collecteurs
        run: python -m unittest discover -s tests -v
      - name: Collecter les actualités
        run: python scripts/collect.py
      - name: Collecter les derniers chapitres
        run: python -m scripts.mangas
      - name: Conserver les articles entre deux collectes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/articles.json data/mangas.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualiser les actualités'
            git push
          fi
      - name: Préparer les fichiers publics
        run: |
          mkdir -p dist
          cp index.html style.css app.js icon.svg manifest.webmanifest dist/
          cp -R icons data fonts dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
